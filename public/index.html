<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق متابعة الأعمال</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-full {
            width: 100%;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 14px;
        }

        /* App Screen */
        .app-container {
            display: none;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .tabs {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            background: #f8f9fa;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            min-height: 400px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Tables */
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-owner {
            background: #ffc107;
            color: #000;
        }

        .badge-editor {
            background: #17a2b8;
            color: white;
        }

        .badge-viewer {
            background: #6c757d;
            color: white;
        }

        .badge-active {
            background: #28a745;
            color: white;
        }

        .badge-completed {
            background: #007bff;
            color: white;
        }

        .badge-on-hold {
            background: #ffc107;
            color: #000;
        }

        .badge-pending {
            background: #ffc107;
            color: #000;
        }

        .badge-in-progress {
            background: #17a2b8;
            color: white;
        }

        .badge-high {
            background: #dc3545;
            color: white;
        }

        .badge-medium {
            background: #ffc107;
            color: #000;
        }

        .badge-low {
            background: #28a745;
            color: white;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #667eea;
        }

        .close-modal {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* Alert */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                text-align: center;
            }

            .user-info {
                width: 100%;
                justify-content: center;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .actions {
                flex-direction: column;
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🏗️ تطبيق متابعة الأعمال</h1>
            <div id="loginAlert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-full">تسجيل الدخول</button>
            </form>
            <div style="margin-top: 20px; text-align: center; color: #666; font-size: 12px;">
                <p>المستخدم الافتراضي: admin</p>
                <p>كلمة المرور: admin123</p>
            </div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appScreen" class="app-container">
        <div class="container">
            <div class="header">
                <h1>🏗️ تطبيق متابعة الأعمال</h1>
                <div class="user-info">
                    <span class="user-badge" id="userBadge"></span>
                    <button onclick="logout()">تسجيل الخروج</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('dashboard')">لوحة التحكم</button>
                <button class="tab" onclick="switchTab('projects')">المشاريع</button>
                <button class="tab" onclick="switchTab('tasks')">المهام</button>
                <button class="tab" onclick="switchTab('users')" id="usersTab">المستخدمين</button>
            </div>

            <div class="content">
                <!-- Dashboard Tab -->
                <div id="dashboardTab" class="tab-content active">
                    <h2 style="margin-bottom: 20px; color: #667eea;">📊 الإحصائيات</h2>
                    <div class="stats-grid" id="statsGrid"></div>
                    <h3 style="margin-top: 30px; margin-bottom: 15px; color: #667eea;">📋 المشاريع النشطة</h3>
                    <div id="recentProjects"></div>
                </div>

                <!-- Projects Tab -->
                <div id="projectsTab" class="tab-content">
                    <div class="table-header">
                        <h2 style="color: #667eea;">📁 المشاريع</h2>
                        <button onclick="showAddProjectModal()" id="addProjectBtn">إضافة مشروع</button>
                    </div>
                    <div id="projectsList"></div>
                </div>

                <!-- Tasks Tab -->
                <div id="tasksTab" class="tab-content">
                    <div class="table-header">
                        <h2 style="color: #667eea;">✅ المهام</h2>
                        <button onclick="showAddTaskModal()" id="addTaskBtn">إضافة مهمة</button>
                    </div>
                    <div id="tasksList"></div>
                </div>

                <!-- Users Tab -->
                <div id="usersTab" class="tab-content">
                    <div class="table-header">
                        <h2 style="color: #667eea;">👥 المستخدمين</h2>
                        <button onclick="showAddUserModal()">إضافة مستخدم</button>
                    </div>
                    <div id="usersList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="projectModalTitle">إضافة مشروع</h2>
                <button class="close-modal" onclick="closeProjectModal()">إغلاق</button>
            </div>
            <form id="projectForm">
                <input type="hidden" id="projectId">
                <div class="form-group">
                    <label>اسم المشروع *</label>
                    <input type="text" id="projectName" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="projectDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>الموقع</label>
                    <input type="text" id="projectLocation">
                </div>
                <div class="form-group">
                    <label>تاريخ البدء</label>
                    <input type="date" id="projectStartDate">
                </div>
                <div class="form-group">
                    <label>تاريخ الانتهاء</label>
                    <input type="date" id="projectEndDate">
                </div>
                <div class="form-group">
                    <label>الحالة</label>
                    <select id="projectStatus">
                        <option value="active">نشط</option>
                        <option value="completed">مكتمل</option>
                        <option value="on-hold">متوقف مؤقتاً</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-success">حفظ</button>
                    <button type="button" class="btn-secondary" onclick="closeProjectModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add/Edit Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="taskModalTitle">إضافة مهمة</h2>
                <button class="close-modal" onclick="closeTaskModal()">إغلاق</button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label>المشروع *</label>
                    <select id="taskProject" required></select>
                </div>
                <div class="form-group">
                    <label>عنوان المهمة *</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="taskDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>الحالة</label>
                    <select id="taskStatus">
                        <option value="pending">معلقة</option>
                        <option value="in-progress">قيد التنفيذ</option>
                        <option value="completed">مكتملة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الأولوية</label>
                    <select id="taskPriority">
                        <option value="low">منخفضة</option>
                        <option value="medium">متوسطة</option>
                        <option value="high">عالية</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تعيين لـ</label>
                    <select id="taskAssignedTo">
                        <option value="">-- غير محدد --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تاريخ الاستحقاق</label>
                    <input type="date" id="taskDueDate">
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-success">حفظ</button>
                    <button type="button" class="btn-secondary" onclick="closeTaskModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add User Modal -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>إضافة مستخدم</h2>
                <button class="close-modal" onclick="closeUserModal()">إغلاق</button>
            </div>
            <form id="userForm">
                <div class="form-group">
                    <label>اسم المستخدم *</label>
                    <input type="text" id="newUsername" required>
                </div>
                <div class="form-group">
                    <label>كلمة المرور *</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="form-group">
                    <label>الدور *</label>
                    <select id="userRole" required>
                        <option value="owner">مالك (جميع الصلاحيات)</option>
                        <option value="editor">محرر (إضافة وتعديل)</option>
                        <option value="viewer">مشاهد (مشاهدة فقط)</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-success">إضافة</button>
                    <button type="button" class="btn-secondary" onclick="closeUserModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;
        let projects = [];
        let tasks = [];
        let users = [];

        // Check if user is logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/me');
                if (response.ok) {
                    currentUser = await response.json();
                    showApp();
                    loadDashboard();
                } else {
                    showLogin();
                }
            } catch (error) {
                showLogin();
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    currentUser = await response.json();
                    showApp();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    showAlert('loginAlert', error.error, 'error');
                }
            } catch (error) {
                showAlert('loginAlert', 'خطأ في الاتصال بالخادم', 'error');
            }
        });

        // Logout
        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            currentUser = null;
            showLogin();
        }

        // Show/Hide screens
        function showLogin() {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appScreen').style.display = 'none';
        }

        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            document.getElementById('userBadge').textContent = `${currentUser.username} (${getRoleText(currentUser.role)})`;
            
            // Hide users tab if not owner
            if (currentUser.role !== 'owner') {
                document.getElementById('usersTab').style.display = 'none';
            }

            // Hide add buttons for viewers
            if (currentUser.role === 'viewer') {
                const addButtons = ['addProjectBtn', 'addTaskBtn'];
                addButtons.forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) btn.style.display = 'none';
                });
            }
        }

        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');

            // Load data
            if (tabName === 'dashboard') loadDashboard();
            else if (tabName === 'projects') loadProjects();
            else if (tabName === 'tasks') loadTasks();
            else if (tabName === 'users') loadUsers();
        }

        // Load Dashboard
        async function loadDashboard() {
            try {
                const [statsResponse, projectsResponse] = await Promise.all([
                    fetch('/api/stats'),
                    fetch('/api/projects')
                ]);

                const stats = await statsResponse.json();
                projects = await projectsResponse.json();

                // Display stats
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <h3>${stats.projectCount}</h3>
                        <p>إجمالي المشاريع</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.taskCount}</h3>
                        <p>إجمالي المهام</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.completedTasks}</h3>
                        <p>مهام مكتملة</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.inProgressTasks}</h3>
                        <p>مهام قيد التنفيذ</p>
                    </div>
                    <div class="stat-card">
                        <h3>${stats.pendingTasks}</h3>
                        <p>مهام معلقة</p>
                    </div>
                `;

                // Display recent projects
                const recentProjects = document.getElementById('recentProjects');
                if (projects.length === 0) {
                    recentProjects.innerHTML = '<div class="empty-state"><h3>لا توجد مشاريع</h3><p>ابدأ بإضافة مشروع جديد</p></div>';
                } else {
                    recentProjects.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>اسم المشروع</th>
                                    <th>الموقع</th>
                                    <th>الحالة</th>
                                    <th>تاريخ البدء</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${projects.slice(0, 5).map(p => `
                                    <tr>
                                        <td>${p.name}</td>
                                        <td>${p.location || '-'}</td>
                                        <td><span class="badge badge-${p.status}">${getStatusText(p.status)}</span></td>
                                        <td>${p.start_date || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        // Load Projects
        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                projects = await response.json();

                const projectsList = document.getElementById('projectsList');
                if (projects.length === 0) {
                    projectsList.innerHTML = '<div class="empty-state"><h3>لا توجد مشاريع</h3><p>ابدأ بإضافة مشروع جديد</p></div>';
                } else {
                    projectsList.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>اسم المشروع</th>
                                    <th>الوصف</th>
                                    <th>الموقع</th>
                                    <th>الحالة</th>
                                    <th>تاريخ البدء</th>
                                    <th>تاريخ الانتهاء</th>
                                    ${currentUser.role !== 'viewer' ? '<th>الإجراءات</th>' : ''}
                                </tr>
                            </thead>
                            <tbody>
                                ${projects.map(p => `
                                    <tr>
                                        <td>${p.name}</td>
                                        <td>${p.description || '-'}</td>
                                        <td>${p.location || '-'}</td>
                                        <td><span class="badge badge-${p.status}">${getStatusText(p.status)}</span></td>
                                        <td>${p.start_date || '-'}</td>
                                        <td>${p.end_date || '-'}</td>
                                        ${currentUser.role !== 'viewer' ? `
                                            <td class="actions">
                                                <button class="btn-small btn-success" onclick="editProject(${p.id})">تعديل</button>
                                                ${currentUser.role === 'owner' ? `<button class="btn-small btn-danger" onclick="deleteProject(${p.id})">حذف</button>` : ''}
                                            </td>
                                        ` : ''}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        // Load Tasks
        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks');
                tasks = await response.json();

                const tasksList = document.getElementById('tasksList');
                if (tasks.length === 0) {
                    tasksList.innerHTML = '<div class="empty-state"><h3>لا توجد مهام</h3><p>ابدأ بإضافة مهمة جديدة</p></div>';
                } else {
                    tasksList.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>المشروع</th>
                                    <th>المهمة</th>
                                    <th>الحالة</th>
                                    <th>الأولوية</th>
                                    <th>معين لـ</th>
                                    <th>تاريخ الاستحقاق</th>
                                    ${currentUser.role !== 'viewer' ? '<th>الإجراءات</th>' : ''}
                                </tr>
                            </thead>
                            <tbody>
                                ${tasks.map(t => `
                                    <tr>
                                        <td>${t.project_name || '-'}</td>
                                        <td>${t.title}</td>
                                        <td><span class="badge badge-${t.status}">${getStatusText(t.status)}</span></td>
                                        <td><span class="badge badge-${t.priority}">${getPriorityText(t.priority)}</span></td>
                                        <td>${t.assigned_to_name || '-'}</td>
                                        <td>${t.due_date || '-'}</td>
                                        ${currentUser.role !== 'viewer' ? `
                                            <td class="actions">
                                                <button class="btn-small btn-success" onclick="editTask(${t.id})">تعديل</button>
                                                <button class="btn-small btn-danger" onclick="deleteTask(${t.id})">حذف</button>
                                            </td>
                                        ` : ''}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        // Load Users
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                users = await response.json();

                const usersList = document.getElementById('usersList');
                usersList.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المستخدم</th>
                                <th>الدور</th>
                                <th>تاريخ الإنشاء</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td>${u.username}</td>
                                    <td><span class="badge badge-${u.role}">${getRoleText(u.role)}</span></td>
                                    <td>${new Date(u.created_at).toLocaleDateString('ar-EG')}</td>
                                    <td>
                                        ${u.id !== currentUser.id ? `<button class="btn-small btn-danger" onclick="deleteUser(${u.id})">حذف</button>` : '-'}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Project Modal
        function showAddProjectModal() {
            document.getElementById('projectModalTitle').textContent = 'إضافة مشروع';
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            document.getElementById('projectModal').classList.add('active');
        }

        async function editProject(id) {
            const project = projects.find(p => p.id === id);
            if (!project) return;

            document.getElementById('projectModalTitle').textContent = 'تعديل مشروع';
            document.getElementById('projectId').value = project.id;
            document.getElementById('projectName').value = project.name;
            document.getElementById('projectDescription').value = project.description || '';
            document.getElementById('projectLocation').value = project.location || '';
            document.getElementById('projectStartDate').value = project.start_date || '';
            document.getElementById('projectEndDate').value = project.end_date || '';
            document.getElementById('projectStatus').value = project.status;
            document.getElementById('projectModal').classList.add('active');
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('active');
        }

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('projectId').value;
            const data = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                location: document.getElementById('projectLocation').value,
                start_date: document.getElementById('projectStartDate').value,
                end_date: document.getElementById('projectEndDate').value,
                status: document.getElementById('projectStatus').value
            };

            try {
                const url = id ? `/api/projects/${id}` : '/api/projects';
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeProjectModal();
                    loadProjects();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في حفظ المشروع');
            }
        });

        async function deleteProject(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المشروع؟')) return;

            try {
                const response = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadProjects();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في حذف المشروع');
            }
        }

        // Task Modal
        async function showAddTaskModal() {
            await loadProjectsForSelect();
            await loadUsersForSelect();
            document.getElementById('taskModalTitle').textContent = 'إضافة مهمة';
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('taskModal').classList.add('active');
        }

        async function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            await loadProjectsForSelect();
            await loadUsersForSelect();

            document.getElementById('taskModalTitle').textContent = 'تعديل مهمة';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskProject').value = task.project_id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDescription').value = task.description || '';
            document.getElementById('taskStatus').value = task.status;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskAssignedTo').value = task.assigned_to || '';
            document.getElementById('taskDueDate').value = task.due_date || '';
            document.getElementById('taskModal').classList.add('active');
        }

        function closeTaskModal() {
            document.getElementById('taskModal').classList.remove('active');
        }

        async function loadProjectsForSelect() {
            if (projects.length === 0) {
                const response = await fetch('/api/projects');
                projects = await response.json();
            }

            const select = document.getElementById('taskProject');
            select.innerHTML = projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }

        async function loadUsersForSelect() {
            if (users.length === 0) {
                const response = await fetch('/api/users');
                users = await response.json();
            }

            const select = document.getElementById('taskAssignedTo');
            select.innerHTML = '<option value="">-- غير محدد --</option>' + users.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
        }

        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('taskId').value;
            const data = {
                project_id: document.getElementById('taskProject').value,
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                status: document.getElementById('taskStatus').value,
                priority: document.getElementById('taskPriority').value,
                assigned_to: document.getElementById('taskAssignedTo').value || null,
                due_date: document.getElementById('taskDueDate').value
            };

            try {
                const url = id ? `/api/tasks/${id}` : '/api/tasks';
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeTaskModal();
                    loadTasks();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في حفظ المهمة');
            }
        });

        async function deleteTask(id) {
            if (!confirm('هل أنت متأكد من حذف هذه المهمة؟')) return;

            try {
                const response = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadTasks();
                    loadDashboard();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في حذف المهمة');
            }
        }

        // User Modal
        function showAddUserModal() {
            document.getElementById('userForm').reset();
            document.getElementById('userModal').classList.add('active');
        }

        function closeUserModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                username: document.getElementById('newUsername').value,
                password: document.getElementById('newPassword').value,
                role: document.getElementById('userRole').value
            };

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeUserModal();
                    loadUsers();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في إضافة المستخدم');
            }
        });

        async function deleteUser(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المستخدم؟')) return;

            try {
                const response = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadUsers();
                } else {
                    const error = await response.json();
                    alert(error.error);
                }
            } catch (error) {
                alert('خطأ في حذف المستخدم');
            }
        }

        // Helper functions
        function showAlert(elementId, message, type) {
            const alertDiv = document.getElementById(elementId);
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        function getRoleText(role) {
            const roles = {
                'owner': 'مالك',
                'editor': 'محرر',
                'viewer': 'مشاهد'
            };
            return roles[role] || role;
        }

        function getStatusText(status) {
            const statuses = {
                'active': 'نشط',
                'completed': 'مكتمل',
                'on-hold': 'متوقف مؤقتاً',
                'pending': 'معلق',
                'in-progress': 'قيد التنفيذ'
            };
            return statuses[status] || status;
        }

        function getPriorityText(priority) {
            const priorities = {
                'low': 'منخفضة',
                'medium': 'متوسطة',
                'high': 'عالية'
            };
            return priorities[priority] || priority;
        }

        // Initialize
        checkAuth();
    </script>
</body>
</html>
